<section class="section py-28 min-h-screen">

  <!-- Decorative background -->
  <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
    <div class="orb orb-violet w-[480px] h-[480px] -top-32 right-1/4"></div>
    <div class="orb orb-cyan w-[380px] h-[380px] bottom-20 -left-10" style="animation-delay:-6s;"></div>
  </div>

  <div class="section-container">

    <!-- Header -->
    <div class="flex items-end justify-between flex-wrap gap-6 mb-14">
      <div>
        <div class="flex items-center gap-4 mb-5">
          <span class="section-num">04 / WORK</span>
          <div class="h-px w-28 bg-gradient-to-r from-violet-500/50 to-transparent"></div>
        </div>
        <h1 class="section-title max-w-2xl">
          Selected <span class="gradient-text">projects.</span>
        </h1>
        <p class="section-subtitle max-w-xl">
          A handful of recent builds — from side-projects to client work — where I had fun
          and learned something.
        </p>
      </div>
    </div>

    <!-- Projects grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

      <div *ngFor="let project of projects; let i = index"
           class="card-hover overflow-hidden group"
           (click)="navigateToProjectWebsite(project.websiteUrl)">

        <!-- Image -->
        <div class="relative overflow-hidden aspect-video"
             style="background: linear-gradient(135deg,#1e1b4b,#082f49);">
          <img [src]="project.imageUrl"
               [alt]="project.title"
               class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent opacity-70 group-hover:opacity-90 transition-opacity"></div>
          <div class="absolute top-4 left-4 proj-tag">#{{ i + 1 }}</div>
        </div>

        <!-- Content -->
        <div class="p-6">
          <h3 class="font-display font-semibold text-xl text-white mb-2">{{ project.title }}</h3>
          <p class="text-sm text-slate-400 leading-relaxed mb-4">{{ project.description }}</p>

          <div class="flex items-center justify-between pt-4 border-t border-white/5">
            <span class="text-xs font-mono text-slate-500">2024 · 2025</span>
            <span class="flex items-center gap-2 text-cyan-300 text-sm font-medium group-hover:gap-3 transition-all">
              Visit <i class="fas fa-arrow-up-right-from-square text-xs"></i>
            </span>
          </div>
        </div>

      </div>

    </div>

    <!-- CTA -->
    <div class="mt-20 card p-10 text-center relative overflow-hidden">
      <div class="absolute inset-0 pointer-events-none"
           style="background: radial-gradient(500px 300px at 50% 0%, rgba(139,92,246,0.15), transparent 60%);"></div>
      <div class="relative">
        <p class="text-slate-400 mb-4 font-mono text-xs tracking-widest">HAVE A PROJECT IN MIND?</p>
        <h3 class="font-display font-bold text-3xl md:text-4xl text-white mb-6">
          Let's <span class="gradient-text">build</span> something together.
        </h3>
        <a routerLink="/contact" class="btn-primary">
          <i class="fas fa-paper-plane"></i>
          Start a conversation
        </a>
      </div>
    </div>

  </div>
</section>
