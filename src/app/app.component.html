<div *ngIf="isLoading" class="loading-overlay">
  <div class="loading-container">
    <div class="loader" aria-label="Loading">
      <div class="loader-ring"></div>
      <div class="loader-mark">MT</div>
    </div>
    <div class="loader-caption">
      <span class="loader-prompt">$</span>
      <span>loading</span>
      <span class="loader-dots" aria-hidden="true"></span>
    </div>
  </div>
</div>

<router-outlet></router-outlet>

<!-- Dev hover hint — small label that follows the mouse only when you hover -->
<!-- an interactive element. Native cursor stays visible everywhere. Hidden  -->
<!-- entirely on touch / coarse-pointer devices.                              -->
<div #devCursor class="dev-cursor" aria-hidden="true">
  <span class="dev-cursor__chev">&rsaquo;</span>
  <span class="dev-cursor__text">click</span>
</div>
